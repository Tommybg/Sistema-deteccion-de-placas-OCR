# Railway config for the FastAPI backend service.
# Build context MUST be the repo root (the Dockerfile COPYs scripts/,
# models/, and samples/ from outside this directory).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# startCommand omitted on purpose: the Dockerfile's CMD wraps uvicorn
# in `sh -c` so that ${PORT} is expanded. Railway's startCommand runs
# without a shell and would receive the literal string "$PORT".
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
